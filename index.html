<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peta Alumni</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0e1b2c;--sea:#16324f;--sand:#f1e7d0;--gold:#f2b632;--mint:#7fd6c2;--err:#ff9b8a}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--ink);color:var(--sand)}
#map{position:absolute;inset:0}
.panel{position:absolute;z-index:1000;left:16px;top:16px;width:min(340px,calc(100% - 32px));max-height:calc(100% - 32px);overflow:auto;background:rgba(14,27,44,.92);border:1px solid rgba(241,231,208,.18);border-radius:14px;padding:18px;backdrop-filter:blur(6px)}
h1{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:1.6rem;line-height:1.1;margin:0 0 4px}
.count{margin:0 0 14px;color:var(--mint);font-size:.9rem}
label{display:block;font-size:.85rem;margin:10px 0 4px}
input,textarea{width:100%;padding:9px 10px;border-radius:8px;border:1px solid rgba(241,231,208,.25);background:var(--sea);color:var(--sand);font:inherit}
textarea{resize:vertical;min-height:58px}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button{width:100%;margin-top:10px;padding:10px;border-radius:8px;border:0;font:inherit;font-weight:600;cursor:pointer}
.ghost{background:transparent;color:var(--sand);border:1px solid rgba(241,231,208,.4)}
.main{background:var(--gold);color:var(--ink)}
button:disabled{opacity:.5;cursor:not-allowed}
.hint{font-size:.8rem;opacity:.75;margin:6px 0 0}
#status{min-height:1.2em;font-size:.85rem;margin-top:10px}
#status.err{color:var(--err)}
#status.ok{color:var(--mint)}
.pin{width:16px;height:16px;border-radius:50%;background:var(--gold);border:3px solid #fff;box-shadow:0 0 0 4px rgba(242,182,50,.35)}
.pin.me{background:var(--mint);box-shadow:0 0 0 4px rgba(127,214,194,.4)}
.leaflet-popup-content{font-family:system-ui,sans-serif;margin:10px 12px}
.leaflet-popup-content b{font-family:'Bricolage Grotesque',system-ui,sans-serif}
.menu{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.menu a,.menu span{flex:1 1 auto;text-align:center;padding:7px 10px;border-radius:999px;font-size:.8rem;font-weight:600;text-decoration:none;border:1px solid rgba(241,231,208,.3);color:var(--sand)}
.menu a:hover{border-color:var(--gold)}
.menu a.on{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.menu span{opacity:.45;cursor:not-allowed}
.cta{display:block;margin-top:12px;padding:11px;border-radius:8px;background:var(--mint);color:var(--ink);font-weight:700;text-align:center;text-decoration:none}
@media (max-width:600px){.panel{top:auto;bottom:0;left:0;width:100%;max-height:60%;border-radius:14px 14px 0 0}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="map"></div>

<section class="panel">
  <nav class="menu" aria-label="Menu utama"><a href="index.html" class="on" aria-current="page">Peta Alumni</a><a href="kuis.html">Kuis Nostalgia</a><span title="Segera hadir">Kartu Obrolan</span><span title="Segera hadir">Voting</span></nav>
  <h1>Peta Alumni</h1>
  <p class="count" id="count">Memuat peta…</p>

  <button class="ghost" id="btnLocate" type="button">Deteksi lokasi saya</button>
  <p class="hint">Atau klik langsung di peta. Penanda hijau bisa digeser.</p>

  <label for="name">Nama</label>
  <input id="name" maxlength="60" placeholder="Nama kamu" autocomplete="name">

  <label for="note">Kabar singkat (opsional)</label>
  <textarea id="note" maxlength="140" placeholder="Sekarang kerja di mana, atau lagi sibuk apa?"></textarea>

  <button class="main" id="btnSave" type="button" disabled>Tandai lokasi saya</button>
  <p class="hint">Lokasi dibulatkan ke area ±1 km supaya alamat rumah tidak terlihat.</p>
  <div id="status" role="status"></div>
  <a class="cta" id="cta" href="kuis.html" hidden>Lanjut ke Kuis Nostalgia →</a>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const statusEl = $('status');
const say = (t, cls = '') => { statusEl.textContent = t; statusEl.className = cls; };
const esc = s => { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; };

// Peta: citra satelit Esri + label nama tempat
const map = L.map('map', { worldCopyJump: true, minZoom: 2, zoomControl: false }).setView([-2.5, 118], 4);
L.control.zoom({ position: 'topright' }).addTo(map);
const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  { maxZoom: 18, attribution: 'Citra &copy; Esri, Maxar, Earthstar Geographics' }).addTo(map);
const labels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
  { maxZoom: 18 }).addTo(map);
const street = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  { maxZoom: 19, attribution: '&copy; OpenStreetMap' });
L.control.layers({ 'Satelit': sat, 'Peta jalan': street }, { 'Nama tempat': labels }, { position: 'topright' }).addTo(map);

const icon = cls => L.divIcon({ className: '', html: `<div class="pin ${cls}"></div>`, iconSize: [16, 16], iconAnchor: [8, 8] });
const store = { get:k=>{try{return localStorage.getItem(k)}catch(e){return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}} };
if (store.get('alumniName')) $('name').value = store.get('alumniName');
if (store.get('alumniDone')) $('cta').hidden = false;
const round = n => Math.round(n * 100) / 100;

// Tampilkan alumni yang sudah tersimpan
function addAlumni(a) {
  L.marker([a.lat, a.lng], { icon: icon('') }).addTo(map)
    .bindPopup(`<b>${esc(a.name)}</b>${a.note ? `<br>${esc(a.note)}` : ''}`);
}
async function load() {
  const { data, error } = await db.from('alumni_locations').select('name,note,lat,lng').order('created_at');
  if (error) { $('count').textContent = 'Data belum bisa dimuat.'; say('Periksa URL dan key Supabase.', 'err'); return; }
  data.forEach(addAlumni);
  $('count').textContent = data.length ? `${data.length} alumni sudah menandai lokasi` : 'Jadilah yang pertama menandai lokasi!';
}

// Penanda milik pengisi (bisa digeser)
let me = null;
function setMe(latlng, zoom) {
  if (me) me.setLatLng(latlng);
  else {
    me = L.marker(latlng, { icon: icon('me'), draggable: true }).addTo(map);
    me.on('dragend', () => say('Lokasi diubah. Klik "Tandai lokasi saya" untuk menyimpan.'));
  }
  $('btnSave').disabled = false;
  if (zoom) map.flyTo(latlng, zoom, { duration: 1.4 });
}
map.on('click', e => { setMe(e.latlng); say('Lokasi dipilih dari peta.', 'ok'); });

$('btnLocate').onclick = () => {
  if (!navigator.geolocation) return say('Browser ini tidak mendukung deteksi lokasi. Klik di peta saja.', 'err');
  say('Mendeteksi lokasi…');
  navigator.geolocation.getCurrentPosition(
    p => { setMe([p.coords.latitude, p.coords.longitude], 12); say('Lokasi terdeteksi. Geser penanda jika kurang pas.', 'ok'); },
    () => say('Izin lokasi ditolak. Klik di peta untuk memilih lokasi.', 'err'),
    { enableHighAccuracy: false, timeout: 10000 }
  );
};

$('btnSave').onclick = async () => {
  const name = $('name').value.trim();
  if (!name) { say('Isi nama dulu.', 'err'); return $('name').focus(); }
  if (!me) return say('Pilih lokasi dulu.', 'err');
  const { lat, lng } = me.getLatLng().wrap();
  const row = { name, note: $('note').value.trim() || null, lat: round(lat), lng: round(lng) };
  $('btnSave').disabled = true; say('Menyimpan…');
  const { error } = await db.from('alumni_locations').insert(row);
  if (error) { $('btnSave').disabled = false; return say('Gagal menyimpan. Coba lagi.', 'err'); }
  map.removeLayer(me); me = null;
  addAlumni(row);
  store.set('alumniName', name); store.set('alumniDone', '1'); $('cta').hidden = false;
  say('Tersimpan. Terima kasih, ' + name + '! Lanjut main kuis, yuk.', 'ok');
  const n = parseInt($('count').textContent) || 0;
  $('count').textContent = `${n + 1} alumni sudah menandai lokasi`;
};

load();
</script>
</body>
</html>
