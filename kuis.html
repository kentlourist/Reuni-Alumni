<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kuis Nostalgia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0e1b2c;--sea:#16324f;--sand:#f1e7d0;--gold:#f2b632;--mint:#7fd6c2;--err:#ff9b8a}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--ink);color:var(--sand)}
body{background:radial-gradient(1200px 600px at 80% -10%,#1d4468 0,transparent 60%),var(--ink);padding:20px 16px 48px}
.wrap{max-width:560px;margin:0 auto}
.panel{background:rgba(14,27,44,.92);border:1px solid rgba(241,231,208,.18);border-radius:14px;padding:20px}
h1,h2{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;line-height:1.15;margin:0 0 6px}
h1{font-size:1.8rem}
h2{font-size:1.35rem}
p{line-height:1.5}
.sub{margin:0 0 14px;color:var(--mint);font-size:.95rem}
.menu{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
.menu a,.menu span{flex:1 1 auto;text-align:center;padding:7px 10px;border-radius:999px;font-size:.8rem;font-weight:600;text-decoration:none;border:1px solid rgba(241,231,208,.3);color:var(--sand)}
.menu a:hover{border-color:var(--gold)}
.menu a.on{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.menu span{opacity:.45;cursor:not-allowed}
label{display:block;font-size:.85rem;margin:12px 0 4px}
input{width:100%;padding:10px;border-radius:8px;border:1px solid rgba(241,231,208,.25);background:var(--sea);color:var(--sand);font:inherit}
button,.btn{display:block;width:100%;margin-top:12px;padding:11px;border-radius:8px;border:0;font:inherit;font-weight:700;cursor:pointer;text-align:center;text-decoration:none}
.main{background:var(--gold);color:var(--ink)}
.mint{background:var(--mint);color:var(--ink)}
.ghost{background:transparent;color:var(--sand);border:1px solid rgba(241,231,208,.4)}
button:disabled{opacity:.5;cursor:not-allowed}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hint{font-size:.82rem;opacity:.75;margin:8px 0 0}
#status{min-height:1.2em;font-size:.85rem;margin-top:10px}
#status.err{color:var(--err)}
#status.ok{color:var(--mint)}
[hidden]{display:none!important}

.progress{display:flex;justify-content:space-between;font-size:.85rem;margin-bottom:8px;color:var(--mint)}
.bar{height:6px;border-radius:99px;background:var(--sea);overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;width:100%;background:var(--gold);transform-origin:left}
.q{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:600;font-size:1.3rem;line-height:1.3;margin:0 0 14px}
.opts{display:grid;gap:8px}
.opt{margin:0;text-align:left;background:var(--sea);color:var(--sand);border:1px solid rgba(241,231,208,.25);font-weight:600}
.opt:hover:not(:disabled){border-color:var(--gold)}
.opt.right{background:var(--mint);color:var(--ink);border-color:var(--mint)}
.opt.wrong{background:var(--err);color:var(--ink);border-color:var(--err)}
.opt:disabled{opacity:1;cursor:default}
.opt:disabled:not(.right):not(.wrong){opacity:.55}
#feedback{min-height:1.4em;margin-top:12px;font-size:.9rem}

.big{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:3.2rem;line-height:1;color:var(--gold);margin:6px 0}
.board{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.board li{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--sea);font-size:.92rem}
.board li.me{outline:2px solid var(--gold)}
.board .rk{width:1.6rem;font-weight:800;color:var(--gold)}
.board .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .sc{font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
<section class="panel">
  <nav class="menu" aria-label="Menu utama"><a href="index.html">Peta Alumni</a><a href="kuis.html" class="on" aria-current="page">Kuis Nostalgia</a><a href="kartu.html">Kartu Obrolan</a><span title="Segera hadir">Voting</span></nav>

  <!-- Awal -->
  <div id="intro">
    <h1>Kuis Nostalgia</h1>
    <p class="sub" id="introInfo">Memuat soal…</p>
    <p>Jawab pertanyaan seputar masa kuliah kita. Makin cepat menjawab, makin besar poinnya.</p>
    <label for="name">Nama</label>
    <input id="name" maxlength="60" placeholder="Nama kamu" autocomplete="name">
    <button class="main" id="btnStart" type="button" disabled>Mulai kuis</button>
    <div id="status" role="status"></div>
  </div>

  <!-- Soal -->
  <div id="play" hidden>
    <div class="progress"><span id="pos"></span><span id="pts"></span></div>
    <div class="bar" aria-hidden="true"><i id="timer"></i></div>
    <p class="q" id="question"></p>
    <div class="opts" id="opts"></div>
    <div id="feedback" role="status"></div>
    <button class="ghost" id="btnNext" type="button" hidden>Soal berikutnya</button>
  </div>

  <!-- Hasil -->
  <div id="result" hidden>
    <h2 id="resTitle">Selesai!</h2>
    <div class="big" id="resScore">0</div>
    <p class="sub" id="resDetail"></p>
    <p class="hint" id="resStatus" role="status"></p>
    <h2 style="margin-top:18px;font-size:1.1rem">Papan skor</h2>
    <ol class="board" id="board"></ol>
    <a class="btn mint" href="kartu.html">Lanjut ke Kartu Obrolan →</a>
    <button class="ghost" id="btnAgain" type="button">Main lagi</button>
  </div>
</section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const say = (t, cls = '') => { $('status').textContent = t; $('status').className = cls; };
const store = { get:k=>{try{return localStorage.getItem(k)}catch(e){return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}} };

const LIMIT = 15;            // detik per soal
const BASE = 100, BONUS = 50; // poin dasar + bonus kecepatan per soal
let qs = [], i = 0, score = 0, correct = 0, t0 = 0, tick = null, locked = false, myName = '';

if (store.get('alumniName')) $('name').value = store.get('alumniName');

async function loadQuestions() {
  const { data, error } = await db.from('quiz_questions')
    .select('position,question,options,answer_index').order('position');
  if (error || !data || !data.length) {
    $('introInfo').textContent = 'Soal belum bisa dimuat.';
    say(error ? 'Periksa URL dan key Supabase.' : 'Belum ada soal di database.', 'err');
    return;
  }
  qs = data;
  $('introInfo').textContent = `${qs.length} soal · ${LIMIT} detik per soal`;
  $('btnStart').disabled = false;
}

function show(id) { ['intro','play','result'].forEach(s => $(s).hidden = s !== id); }

function start() {
  myName = $('name').value.trim();
  if (!myName) { say('Isi nama dulu.', 'err'); return $('name').focus(); }
  store.set('alumniName', myName);
  i = 0; score = 0; correct = 0;
  show('play'); showQ();
}

function showQ() {
  const q = qs[i];
  locked = false;
  $('pos').textContent = `Soal ${i + 1} dari ${qs.length}`;
  $('pts').textContent = `${score} poin`;
  $('question').textContent = q.question;
  $('feedback').textContent = '';
  $('btnNext').hidden = true;
  const box = $('opts'); box.innerHTML = '';
  q.options.forEach((text, idx) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'opt'; b.textContent = text;
    b.onclick = () => answer(idx);
    box.appendChild(b);
  });
  t0 = performance.now();
  clearInterval(tick);
  tick = setInterval(() => {
    const left = Math.max(0, LIMIT - (performance.now() - t0) / 1000);
    $('timer').style.transform = `scaleX(${left / LIMIT})`;
    if (left <= 0) answer(-1);
  }, 100);
}

function answer(idx) {
  if (locked) return;
  locked = true; clearInterval(tick);
  const q = qs[i];
  const left = Math.max(0, LIMIT - (performance.now() - t0) / 1000);
  const btns = [...$('opts').children];
  btns.forEach(b => b.disabled = true);
  btns[q.answer_index].classList.add('right');
  if (idx === q.answer_index) {
    const gain = BASE + Math.round(BONUS * left / LIMIT);
    score += gain; correct++;
    $('feedback').textContent = `Benar! +${gain} poin`;
  } else if (idx === -1) {
    $('feedback').textContent = 'Waktu habis. Jawaban yang benar ditandai hijau.';
  } else {
    btns[idx].classList.add('wrong');
    $('feedback').textContent = 'Belum tepat. Jawaban yang benar ditandai hijau.';
  }
  $('pts').textContent = `${score} poin`;
  $('btnNext').textContent = i + 1 < qs.length ? 'Soal berikutnya' : 'Lihat hasil';
  $('btnNext').hidden = false;
  $('btnNext').focus();
}

async function finish() {
  show('result');
  score = Math.min(score, 5000);
  $('resScore').textContent = score;
  $('resDetail').textContent = `${correct} dari ${qs.length} soal benar`;
  $('resStatus').textContent = 'Menyimpan skor…';
  $('resStatus').className = 'hint';
  const { error } = await db.from('quiz_scores').insert({ name: myName, score, correct, total: qs.length });
  if (error) $('resStatus').textContent = 'Skor belum tersimpan. Papan skor di bawah mungkin belum memuat skormu.';
  else { $('resStatus').textContent = 'Skor tersimpan.'; store.set('quizDone', '1'); }
  loadBoard();
}

async function loadBoard() {
  const { data, error } = await db.from('quiz_scores')
    .select('name,score,created_at').order('score', { ascending: false }).order('created_at').limit(10);
  const ol = $('board'); ol.innerHTML = '';
  if (error || !data) { ol.innerHTML = '<li>Papan skor belum bisa dimuat.</li>'; return; }
  let marked = false;
  data.forEach((r, n) => {
    const li = document.createElement('li');
    if (!marked && r.name === myName && r.score === score) { li.className = 'me'; marked = true; }
    li.innerHTML = '<span class="rk"></span><span class="nm"></span><span class="sc"></span>';
    li.children[0].textContent = n + 1;
    li.children[1].textContent = r.name;
    li.children[2].textContent = r.score;
    ol.appendChild(li);
  });
}

$('btnStart').onclick = start;
$('name').addEventListener('keydown', e => { if (e.key === 'Enter' && !$('btnStart').disabled) start(); });
$('btnNext').onclick = () => { if (i + 1 < qs.length) { i++; showQ(); } else finish(); };
$('btnAgain').onclick = () => { show('intro'); say(''); };

loadQuestions();
</script>
</body>
</html>
